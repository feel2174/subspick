<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="60%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#08101E" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <radialGradient id="glowSphere1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowSphere2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="300" cy="150" r="400" fill="url(#glowSphere1)" />
  <circle cx="950" cy="450" r="450" fill="url(#glowSphere2)" />

  <!-- Outer Border -->
  <rect x="20" y="20" width="1160" height="590" rx="32" fill="none" stroke="rgba(51, 65, 85, 0.4)" stroke-width="2" />

  <!-- Top Logo & Badge -->
  <g transform="translate(100, 80)">
    <rect width="52" height="52" rx="16" fill="#0F172A" stroke="rgba(51,65,85,0.6)" stroke-width="1.5" />
    <path d="M29 9 L15 28 L26 28 L23 43 L39 24 L28 24 Z" fill="url(#emeraldGrad)" />
    <text x="68" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5">서브스픽</text>
    <text x="210" y="36" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1">SUBSPICK</text>
  </g>

  <!-- Floating Discount Badge (Right Side) -->
  <g transform="translate(860, 90)" filter="url(#shadow)">
    <rect width="240" height="110" rx="24" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <text x="120" y="48" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">GAMSGO 제휴 특가</text>
    <text x="120" y="90" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" text-anchor="middle">최대 70%</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 240)">
    <text x="0" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="2">2026 SMART SAVINGS DASHBOARD</text>
    <text x="0" y="110" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">매달 새어나가는 구독료,</text>
    <text x="0" y="180" fill="url(#emeraldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">스마트하게 최대 70% 절약</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1: YouTube -->
    <g transform="translate(0, 0)">
      <rect width="210" height="52" rx="16" fill="#0F172A" stroke="rgba(51, 65, 85, 0.6)" stroke-width="1.5" />
      <text x="24" y="33" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">유튜브 프리미엄</text>
    </g>

    <!-- Pill 2: Netflix -->
    <g transform="translate(225, 0)">
      <rect width="180" height="52" rx="16" fill="#0F172A" stroke="rgba(51, 65, 85, 0.6)" stroke-width="1.5" />
      <text x="24" y="33" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">넷플릭스 4K</text>
    </g>

    <!-- Pill 3: ChatGPT -->
    <g transform="translate(420, 0)">
      <rect width="180" height="52" rx="16" fill="#0F172A" stroke="rgba(51, 65, 85, 0.6)" stroke-width="1.5" />
      <text x="24" y="33" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">챗GPT Plus</text>
    </g>

    <!-- Pill 4: Calculator -->
    <g transform="translate(615, 0)">
      <rect width="200" height="52" rx="16" fill="#10B981" />
      <text x="100" y="33" fill="#090D16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">실시간 절약 계산기</text>
    </g>
  </g>

  <!-- Footer Link -->
  <text x="1100" y="580" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="end">subspick.pages.dev</text>
</svg>
